# Consul Profile Configuration

# Inherit dev settings but override backend discovery to use Consul
nanogate:
  routing:
    discovery:
      consul:
        host: localhost
        port: 8500
    backend-sets:
      - name: user-service-backend
        discovery-type: CONSUL
        service-id: mock-user-service
        load-balancer: ROUND_ROBIN
        http-client:
          connectTimeout: 8s
        health-check:
          path: /health
          interval: 10s
          timeout: 2s
        resilience:
          failureRateThreshold: 50.0
          slidingWindowSize: 10
          minimumNumberOfCalls: 5
          waitDurationInOpenState: 10s
        rate-limit:
          requestsPerSecond: 10
          resolver: "IP"

      - name: order-service-backend
        discovery-type: CONSUL
        service-id: mock-order-service
        load-balancer: ROUND_ROBIN
