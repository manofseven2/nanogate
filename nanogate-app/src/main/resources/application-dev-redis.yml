nanogate:
  resilience:
    rate-limiter:
      type: redis
  routing:
    backend-sets:
      - name: mock-backend
        servers:
          - http://localhost:8081 # Placeholder for backend
    routes:
      - id: redis-rate-limit-test
        path: /api/redis-test/**
        backend-set: mock-backend
        rate-limit:
          requestsPerSecond: 2
          resolver: IP

spring:
  data:
    redis:
      host: localhost
      port: 6379

management:
  health:
    redis:
      enabled: true
